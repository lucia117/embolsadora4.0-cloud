name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: embolsadora
  REGION: us-east1
  SERVICE: embolsadora-api
  IMAGE: us-east1-docker.pkg.dev/embolsadora/cloud-run-source-deploy/embolsadora-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Autenticación sin claves: OIDC de GitHub → Workload Identity Federation.
    # El provider solo acepta tokens de este repositorio (attribute-condition).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/669897123692/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@embolsadora.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build de la imagen
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Push a Artifact Registry
        run: docker push --all-tags "$IMAGE"

      - name: Deploy a Cloud Run
        # Solo actualiza la imagen: las env vars del servicio se conservan.
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          curl -sf --retry 3 --retry-delay 5 "$URL/ping" | grep -q pong
          echo "OK: $URL/ping responde"
