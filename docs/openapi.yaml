openapi: 3.1.0
info:
  title: Embolsadora Cloud API
  version: 2.0.0-alpha
  description: >
    Superficies separadas:
    - **/api/v1/**: ABM (JWT RS256 via Supabase JWKS + X-Tenant-ID + RBAC)
    - **/api/v1/consumers/**: Ingesta batch (API Key + idempotencia)
    - **/api/v1/public/**: Lectura sin autenticación (branding/routing de tenant)

    **Breaking changes desde v1**: eliminado `/api/auth` — autenticación delegada a Supabase Auth.
servers:
  - url: https://api.tu-dominio.com

tags:
  - name: Auth
  - name: Me
  - name: Invitations
  - name: Users
  - name: UserRoles
  - name: Machines
  - name: Tenants
  - name: Consumers
  - name: Logs
  - name: Retention
  - name: Notifications
  - name: Permissions
  - name: Roles
  - name: AlarmRules
  - name: DashboardLayouts
  - name: DashboardMetrics
  - name: EdgeDevices

paths:
  ########################
  # Auth (Supabase delegado)
  ########################
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login contra Supabase Auth (password grant)
      description: >
        Proxy transparente a `POST {SUPABASE_URL}/auth/v1/token?grant_type=password`.
        La respuesta (status y body) de Supabase se reenvía tal cual — no hay
        transformación ni envelope propio. Si el fetch a Supabase falla (red,
        timeout), responde 502.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login exitoso — body pasado tal cual desde Supabase (access_token, refresh_token, token_type, expires_in, user, ...)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupabaseAuthResponse' }
        '400':
          description: Body inválido (bind falló) o error 4xx pasado tal cual desde Supabase (ej. credenciales incorrectas)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '502':
          description: No se pudo contactar a Supabase Auth
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/me:
    get:
      tags: [Me]
      summary: Perfil propio con tenant, rol y permisos
      description: No requiere `X-Tenant-ID`. Devuelve tenant/role/permissions si el usuario tiene un rol activo.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string, format: email, nullable: true }
                      name: { type: string, nullable: true }
                      password_change_required: { type: boolean }
                    required: [id, password_change_required]
                  tenant:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      subdomain: { type: string }
                    required: [id, name, subdomain]
                  role:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string }
                      name: { type: string }
                    required: [id, name]
                  permissions:
                    type: array
                    items: { type: string }
                required: [user, permissions]
        '401': { description: Token ausente o inválido }
        '503': { description: Supabase JWKS no disponible }

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Confirmar cambio de contraseña (limpia el flag password_change_required)
      description: No requiere `X-Tenant-ID` ni pasa por `PasswordChangeGuard`. El nuevo token de Supabase ya contiene la sesión renovada.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Flag limpiado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: password changed }
        '401': { description: Token ausente o inválido }

  ########################
  # Invitations
  ########################
  /api/v1/invitations:
    get:
      tags: [Invitations]
      summary: Listar invitaciones del tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [pending, accepted, revoked, expired] }
      responses:
        '200':
          description: Lista de invitaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { description: Token ausente o inválido }
        '403': { description: Sin acceso al tenant }
    post:
      tags: [Invitations]
      summary: Crear invitación (requiere permiso invitations:write)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                role_id: { type: string }
              required: [email, role_id]
      responses:
        '201':
          description: Invitación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Token ausente o inválido }
        '403': { description: Sin permiso invitations:write }
        '409':
          description: Ya existe invitación pendiente para este email en el tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/invitations/{id}/resend:
    post:
      tags: [Invitations]
      summary: Reenviar invitación pendiente
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ID'
      responses:
        '200': { description: Email reenviado }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Invitación no está en estado pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /api/v1/invitations/{id}:
    delete:
      tags: [Invitations]
      summary: Revocar invitación (requiere permiso invitations:write)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ID'
      responses:
        '200': { description: Invitación revocada }
        '403': { description: Sin permiso invitations:write }
        '404': { $ref: '#/components/responses/NotFound' }

  ########################
  # Users (force password change)
  ########################
  /api/v1/users/{id}/force-password-change:
    post:
      tags: [Users]
      summary: Forzar cambio de contraseña (requiere permiso users:write)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ID'
      responses:
        '200': { description: Flag activado y email de reset enviado }
        '403': { description: Sin permiso users:write }
        '404': { $ref: '#/components/responses/NotFound' }

  ########################
  # ABM (JWT + RBAC)
  ########################
  /api/v1/users/pending:
    get:
      tags: [Users]
      summary: Listar usuarios con invitación pendiente de activación
      description: Requiere permiso `perm_users_view`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuarios pendientes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingUserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users:
    get:
      tags: [Users]
      summary: Listar usuarios del tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Tenant-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: UUID del tenant
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Crear usuario (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Tenant-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UserCreate' } }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email ya existe en el tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/v1/users/me:
    patch:
      tags: [Users]
      summary: Autoeditar el propio perfil (self-service, sin RBAC)
      description: >
        El usuario destino sale del JWT (`platform.DomainUser`), nunca de la URL o del
        body, así que no hay forma de apuntar a otro usuario ni de auto-asignarse un
        rol: el body solo admite `firstName`/`lastName`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Tenant-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UserUpdateMe' } }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{userId}:
    get:
      tags: [Users]
      summary: Obtener usuario por ID
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Actualizar usuario (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Eliminar usuario — soft delete (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Usuario eliminado (soft delete)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{userId}/roles:
    get:
      tags: [UserRoles]
      summary: Obtener roles de un usuario
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lista de roles del usuario
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/UserRoleItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/user-roles:
    get:
      tags: [UserRoles]
      summary: Listar asignaciones de rol
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, pending, revoked] }
      responses:
        '200':
          description: Lista de asignaciones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/UserRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [UserRoles]
      summary: Asignar rol a un usuario
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRoleAssign' }
      responses:
        '201':
          description: Rol asignado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: El usuario ya tiene un rol activo en este tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/v1/user-roles/bulk:
    post:
      tags: [UserRoles]
      summary: Asignación masiva de roles (all-or-nothing)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRoleBulkAssign' }
      responses:
        '201':
          description: Todos los roles asignados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          assigned: { type: integer }
                          failed: { type: integer }
                          assignments:
                            type: array
                            items: { $ref: '#/components/schemas/UserRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Uno o más usuarios ya tienen rol activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/v1/user-roles/{id}:
    put:
      tags: [UserRoles]
      summary: Actualizar rol de una asignación
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId: { type: string }
              required: [roleId]
      responses:
        '200':
          description: Asignación actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [UserRoles]
      summary: Revocar asignación de rol (soft delete — status revoked)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Asignación revocada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          status: { type: string, enum: [revoked] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/machines:
    get:
      tags: [Machines]
      summary: Listar máquinas
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/MachineList' }
    post:
      tags: [Machines]
      summary: Crear máquina
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MachineCreate' } }
      responses:
        '201': { $ref: '#/components/responses/CreatedID' }

  /api/v1/tenants:
    get:
      tags: [Tenants]
      summary: Listar tenants
      description: Requiere rol `super_admin` (permiso `tenants:read`). Pasar `X-Tenant-ID` del tenant MRG interno (`mrg-internal`).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
          description: UUID del tenant MRG interno (00000000-0000-0000-0000-000000000000).
      responses:
        '200':
          description: Lista de tenants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Tenants]
      summary: Crear tenant
      description: Requiere rol `super_admin` (permiso `tenants:write`). Pasar `X-Tenant-ID` del tenant MRG interno (`mrg-internal`).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
          description: UUID del tenant MRG interno (00000000-0000-0000-0000-000000000000).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TenantCreate' } }
      responses:
        '201':
          description: Tenant creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: '#/components/schemas/Tenant' }
                required: [tenant]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/tenants/{id}:
    get:
      tags: [Tenants]
      summary: Obtener tenant por ID
      description: Requiere rol `super_admin` (permiso `tenants:read`). Pasar `X-Tenant-ID` del tenant MRG interno.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ID'
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
          description: UUID del tenant MRG interno (00000000-0000-0000-0000-000000000000).
      responses:
        '200':
          description: Tenant encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: '#/components/schemas/Tenant' }
                required: [tenant]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Tenants]
      summary: Actualizar tenant (campos parciales)
      description: Requiere rol `super_admin` (permiso `tenants:write`). Pasar `X-Tenant-ID` del tenant MRG interno.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ID'
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
          description: UUID del tenant MRG interno (00000000-0000-0000-0000-000000000000).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TenantUpdate' } }
      responses:
        '200':
          description: Tenant actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Tenants]
      summary: Eliminar tenant
      description: Requiere rol `super_admin` (permiso `tenants:write`). Pasar `X-Tenant-ID` del tenant MRG interno.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ID'
        - in: header
          name: X-Tenant-ID
          required: true
          schema: { type: string, format: uuid }
          description: UUID del tenant MRG interno (00000000-0000-0000-0000-000000000000).
      responses:
        '204':
          description: Tenant eliminado
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  ########################
  # Public (sin autenticación)
  ########################
  /api/v1/public/tenants/{idOrSubdomain}:
    get:
      tags: [Tenants]
      summary: Obtener tenant público por ID o subdominio
      description: Sin autenticación, sin `X-Tenant-ID`. Usado por el callback de invitación/reset de contraseña (corre antes de que exista sesión) y la landing pública del tenant.
      security: []
      parameters:
        - name: idOrSubdomain
          in: path
          required: true
          description: UUID del tenant o su subdominio (subdominio se compara case-insensitive).
          schema: { type: string }
      responses:
        '200':
          description: Tenant público encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicTenantResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  ########################
  # CONSUMERS (API Key)
  ########################
  /api/v1/consumers/events:
    post:
      tags: [Consumers]
      summary: Ingesta batch de eventos
      description: |
        - Idempotencia por item (**eventId** único).
        - Header **Idempotency-Key** opcional para el batch (TTL 10 min).
        - Máx 1000 eventos y 2 MB por request.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Clave idempotente del batch.
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchEvents' }
      responses:
        '200': { $ref: '#/components/responses/BatchAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/consumers/heartbeat:
    post:
      tags: [Consumers]
      summary: Heartbeat de dispositivo
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Heartbeat' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  ########################
  # Logs — List
  ########################
  /api/v1/logs:
    get:
      tags: [Logs]
      summary: Listar logs del tenant con filtros y paginación por cursor
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: event_type, in: query, schema: { type: string, enum: [alarm_triggered, alarm_resolved, device_connected, device_disconnected, device_state_changed, user_action, system] } }
        - { name: severity,   in: query, schema: { type: string, enum: [info, warning, critical, error] } }
        - { name: machine_id, in: query, schema: { type: string, format: uuid } }
        - { name: from,       in: query, schema: { type: string, format: date-time } }
        - { name: to,         in: query, schema: { type: string, format: date-time } }
        - { name: q,          in: query, schema: { type: string } }
        - { name: cursor,     in: query, schema: { type: string } }
        - { name: limit,      in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Lista de logs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogListResponse' }
        '400':
          description: Parámetros inválidos (ej. from > to, cursor inválido, severity desconocido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  ########################
  # Logs — Export
  ########################
  /api/v1/logs/export:
    get:
      tags: [Logs]
      summary: Exportar logs filtrados (máx 50.000)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: event_type, in: query, schema: { type: string } }
        - { name: severity,   in: query, schema: { type: string } }
        - { name: machine_id, in: query, schema: { type: string, format: uuid } }
        - { name: from,       in: query, schema: { type: string, format: date-time } }
        - { name: to,         in: query, schema: { type: string, format: date-time } }
        - { name: q,          in: query, schema: { type: string } }
        - { name: format,     in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: Exportación completada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogExportResponse' }
        '400':
          description: Parámetros inválidos (ej. from > to, severity desconocido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  ########################
  # Logs — Stream SSE
  ########################
  /api/v1/logs/stream:
    get:
      tags: [Logs]
      summary: Streaming SSE de nuevos eventos en tiempo real
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: event_type, in: query, schema: { type: string } }
        - { name: severity,   in: query, schema: { type: string } }
      responses:
        '200':
          description: Conexión SSE establecida
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  ########################
  # Logs — Retention
  ########################
  /api/v1/logs/retention:
    get:
      tags: [Retention]
      summary: Obtener política de retención del tenant
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Política de retención actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Retention]
      summary: Actualizar política de retención (requiere logs:admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRetentionRequest' }
      responses:
        '200':
          description: Política actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  ########################
  # Logs — By ID
  ########################
  /api/v1/logs/{id}:
    get:
      tags: [Logs]
      summary: Obtener log por ID
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Log encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  ########################
  # Logs — Context
  ########################
  /api/v1/logs/{id}/context:
    get:
      tags: [Logs]
      summary: Obtener ventana de logs alrededor de un evento
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id,       in: path,  required: true, schema: { type: string, format: uuid } }
        - { name: window_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Ventana de contexto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogContextResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  ##############################################
  # Notification Service
  ##############################################

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Listar notificaciones del tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [unread, acknowledged, closed] } }
        - { name: severity, in: query, schema: { type: string, enum: [info, warning, critical, error] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: Lista paginada de notificaciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/notifications/count:
    get:
      tags: [Notifications]
      summary: Conteo de notificaciones no leídas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Conteo de no leídas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/notifications/{id}:
    get:
      tags: [Notifications]
      summary: Obtener detalle de una notificación
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detalle de la notificación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notifications/{id}/ack:
    post:
      tags: [Notifications]
      summary: Acusar recibo de una notificación (idempotente)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Notificación acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notifications/{id}/close:
    post:
      tags: [Notifications]
      summary: Cerrar una notificación (idempotente)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Notificación closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  ########################
  # Permissions
  ########################
  /api/v1/permissions:
    get:
      tags: [Permissions]
      summary: Listar permisos del catálogo
      description: Sin RBAC adicional — cualquier usuario autenticado puede consultar.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de permisos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Permissions]
      summary: Crear un permiso
      description: Requiere `perm_users_manage`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionCreate' }
      responses:
        '201':
          description: Permiso creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '400':
          description: Validación fallida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/permissions/{id}:
    get:
      tags: [Permissions]
      summary: Obtener un permiso por ID
      description: Sin RBAC adicional.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Permiso encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Permiso no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionError' }
    put:
      tags: [Permissions]
      summary: Actualizar un permiso
      description: Requiere `perm_users_manage`. Los permisos del sistema (`isSystemPermission=true`) no se pueden modificar.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionCreate' }
      responses:
        '200':
          description: Permiso actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: No se pueden modificar permisos del sistema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionError' }
        '404':
          description: Permiso no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionError' }
    delete:
      tags: [Permissions]
      summary: Eliminar un permiso
      description: Requiere `perm_users_manage`. Los permisos del sistema no se pueden eliminar.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Permiso eliminado
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean } }
                required: [success]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: No se pueden eliminar permisos del sistema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionError' }
        '404':
          description: Permiso no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionError' }

  ########################
  # Roles
  ########################
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: Listar roles del tenant
      description: Sin RBAC adicional — cualquier usuario autenticado puede listar/ver roles.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Roles]
      summary: Crear un rol
      description: Requiere `perm_users_manage`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWrite' }
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400':
          description: "Validación fallida o límite de roles alcanzado (LIMIT_REACHED)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe un rol con ese nombre (DUPLICATE_NAME)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/roles/{id}:
    get:
      tags: [Roles]
      summary: Obtener un rol por ID
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rol encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Rol no encontrado (ROLE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Roles]
      summary: Actualizar un rol
      description: Requiere `perm_users_manage`. Los roles del sistema no se pueden modificar (SYSTEM_ROLE).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWrite' }
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Rol del sistema, no modificable (SYSTEM_ROLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Rol no encontrado (ROLE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Ya existe un rol con ese nombre (DUPLICATE_NAME)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Roles]
      summary: Eliminar un rol
      description: Requiere `perm_users_manage`. Falla si el rol tiene asignaciones activas (ROLE_HAS_ASSIGNMENTS).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rol eliminado
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Rol del sistema, no eliminable (SYSTEM_ROLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Rol no encontrado (ROLE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: El rol tiene usuarios asignados (ROLE_HAS_ASSIGNMENTS)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      usersAffected: { type: integer }

  ########################
  # Alarm Rules
  ########################
  /api/v1/alarm-rules:
    get:
      tags: [AlarmRules]
