      responses:
        '200':
          description: Regla eliminada
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Regla no encontrada (ALARM_RULE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  ########################
  # Dashboard Layouts
  ########################
  /api/v1/dashboard-layouts:
    get:
      tags: [DashboardLayouts]
      summary: Listar layouts de dashboard del usuario
      description: tenant_id viene de `X-Tenant-ID`, user_id del JWT. Sin RBAC adicional más allá de estar autenticado.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de layouts (máx. 3 por usuario/tenant)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayoutList' }
        '401':
          description: Usuario no identificado en el JWT (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [DashboardLayouts]
      summary: Crear un layout de dashboard
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardLayoutWrite' }
      responses:
        '200':
          description: Layout creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Usuario no identificado en el JWT (UNAUTHORIZED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Límite de layouts alcanzado (LIMIT_REACHED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Ya existe un layout con ese nombre (DUPLICATE_NAME)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/dashboard-layouts/{layoutId}:
    get:
      tags: [DashboardLayouts]
      summary: Obtener un layout por ID
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: layoutId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Layout encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Layout no encontrado (LAYOUT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [DashboardLayouts]
      summary: Actualizar un layout
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: layoutId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardLayoutWrite' }
      responses:
        '200':
          description: Layout actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Layout no encontrado (LAYOUT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Ya existe un layout con ese nombre (DUPLICATE_NAME)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [DashboardLayouts]
      summary: Eliminar un layout
      description: No se puede eliminar el último layout del usuario (CANNOT_DELETE_LAST_LAYOUT).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: layoutId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Layout eliminado
          content:
            application/json:
              schema: { type: object }
        '400':
          description: No se puede eliminar el último layout (CANNOT_DELETE_LAST_LAYOUT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Layout no encontrado (LAYOUT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  ########################
  # Dashboard Metrics
  ########################
  /api/v1/dashboards/metrics/query:
    post:
      tags: [DashboardMetrics]
      summary: Consultar métricas de una máquina
      description: >
        Requiere `perm_metrics_view`. Sujeto a rate limit por tenant
        (`DashboardRateLimit`, responde 429 con header `Retry-After`).
        `metrics` acepta hasta `MaxSpecs` (10) entradas.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricsQueryRequest' }
      responses:
        '200':
          description: Resultado de la consulta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsQueryEnvelope' }
        '400':
          description: "Parámetros inválidos, X-Tenant-ID ausente/inválido, JSON malformado, o conflicto de modo (ej. RAW_MODE_CONFLICT, GROUP_BY_CONFLICT, RANGE_TOO_WIDE, TOO_MANY_METRICS, TOO_MANY_GROUPS)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '504':
          description: Timeout consultando Mongo (QUERY_TIMEOUT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/dashboards/metrics/catalog:
    get:
      tags: [DashboardMetrics]
      summary: Listar los aasPaths disponibles para una máquina
      description: Requiere `perm_metrics_view`. Sujeto al mismo rate limit que `/query`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: machineId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Catálogo de métricas disponibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsCatalogResponse' }
        '400':
          description: X-Tenant-ID ausente/inválido o machineId ausente (INVALID_PARAMS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/dashboards/metrics/query/batch:
    post:
      tags: [DashboardMetrics]
      summary: Consultar métricas de varias máquinas/consultas en un solo request
      description: >
        Requiere `perm_metrics_view`. Hasta `MaxBatchQueries` (50) consultas
        por batch, cada una con su propio `id`. Los errores de una consulta
        individual no abortan el resto del batch.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricsBatchRequest' }
      responses:
        '200':
          description: Resultados del batch (por ítem, ver `MetricsBatchResultItem.success`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsBatchResponse' }
        '400':
          description: "Parámetros inválidos a nivel batch (ej. ids duplicados, más de MaxBatchQueries consultas)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  ########################
  # Edge Devices — núcleo
  ########################
  /api/v1/tenants/{tenantId}/edge-devices:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [EdgeDevices]
      summary: Listar dispositivos edge del tenant
      description: Requiere `perm_edge_devices_view`. Tenant resuelto desde el path, no desde `X-Tenant-ID`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de dispositivos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [EdgeDevices]
      summary: Crear un dispositivo edge
      description: Requiere `perm_edge_devices_create`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeDeviceCreate' }
      responses:
        '201':
          description: Dispositivo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceEnvelope' }
        '400':
          description: Body inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "machineId ya existe en el tenant"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [EdgeDevices]
      summary: Obtener un dispositivo edge por ID
      description: Requiere `perm_edge_devices_view`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dispositivo encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }
    put:
      tags: [EdgeDevices]
      summary: Actualizar un dispositivo edge
      description: Requiere `perm_edge_devices_manage`. `machineId` y `edgeType` son inmutables (se ignoran si se envían).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeDeviceUpdate' }
      responses:
        '200':
          description: Dispositivo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceEnvelope' }
        '400':
          description: "Nombre vacío o raspberryBaseUrl inválida"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}/enable:
    post:
      tags: [EdgeDevices]
      summary: Habilitar un dispositivo edge
      description: Requiere `perm_edge_devices_manage`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Dispositivo habilitado (status pasa a ACTIVE)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}/disable:
    post:
      tags: [EdgeDevices]
      summary: Deshabilitar un dispositivo edge
      description: Requiere `perm_edge_devices_manage`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Dispositivo deshabilitado (status pasa a DISABLED)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  ########################
  # Edge Devices — operacional
  ########################
  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}/status:
    post:
      tags: [EdgeDevices]
      summary: Disparar un chequeo de status contra el dispositivo
      description: Requiere `perm_edge_devices_check`. Queda registrado en el audit trail (`userId`/`userEmail` del JWT).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resultado del chequeo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceCheckResultEnvelope' }
        '400':
          description: "Dispositivo deshabilitado (EDGE_DEVICE_DISABLED)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}/health-check:
    post:
      tags: [EdgeDevices]
      summary: Disparar un health check contra el dispositivo
      description: Requiere `perm_edge_devices_check`. Igual contrato que `/status`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resultado del chequeo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceCheckResultEnvelope' }
        '400':
          description: "Dispositivo deshabilitado (EDGE_DEVICE_DISABLED)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}/telemetry:
    get:
      tags: [EdgeDevices]
      summary: Obtener telemetría actual del dispositivo
      description: Requiere `perm_edge_devices_view`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Telemetría del dispositivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceTelemetryEnvelope' }
        '400':
          description: "Dispositivo deshabilitado (EDGE_DEVICE_DISABLED)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}/events:
    get:
      tags: [EdgeDevices]
      summary: Listar el historial de chequeos (status/health-check) del dispositivo
      description: Requiere `perm_edge_devices_view`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Historial de eventos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceEventListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}/api-keys:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [EdgeDevices]
      summary: Listar API keys del dispositivo
      description: Requiere `perm_edge_devices_view`. No expone secretos, solo metadata.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de API keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceAPIKeyListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }
    post:
      tags: [EdgeDevices]
      summary: Emitir una nueva API key para el dispositivo
      description: >
        Requiere `perm_edge_devices_manage`. El secreto en texto plano solo se
        devuelve en esta respuesta — nunca vuelve a exponerse (ver GET, que
        solo devuelve metadata).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeDeviceAPIKeyCreate' }
      responses:
        '201':
          description: API key creada (incluye el secreto en texto plano una única vez)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceAPIKeyEnvelope' }
        '400':
          description: Body malformado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dispositivo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

  /api/v1/tenants/{tenantId}/edge-devices/{deviceId}/api-keys/{keyId}:
    delete:
      tags: [EdgeDevices]
      summary: Revocar una API key del dispositivo
      description: Requiere `perm_edge_devices_manage`. Idempotente.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: keyId, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: API key revocada
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: "API key no encontrada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeDeviceErrorEnvelope' }

components:
  ########################
  # Security
  ########################
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT RS256 emitido por Supabase Auth. El tenant se resuelve desde el header `X-Tenant-ID` validando membresía activa en `user_tenant_roles`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Cada API Key está asociada a un `tenant_id`. El servidor ignora `X-Tenant-Id` del cliente.

  ########################
  # Common parameters
  ########################
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor de paginación (keyset).
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Máximo de elementos a retornar (1..200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ID:
      name: id
      in: path
      required: true
      description: UUID del recurso.
      schema: { type: string, format: uuid }

  ########################
  # Schemas
  ########################
  schemas:
    JWTError:
      type: object
      description: Formato de error retornado por el middleware JWTAuth (401) y middleware RBAC (403)
      properties:
        error:
          type: string
          example: "UNAUTHORIZED"
        message:
          type: string
          example: "No autorizado"
        status:
          type: integer
          example: 401

    Envelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
          properties:
            next_cursor: { type: string, nullable: true }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
      required: [data]

    IDResponse:
      type: object
      properties: { id: { type: string } }
      required: [id]

    # Users
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [admin, user] }
        image: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
      required: [id, tenantId, firstName, lastName, email, role, createdAt, updatedAt]
    UserCreate:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [admin, user] }
        image: { type: string, nullable: true }
      required: [firstName, lastName, email, role]
    UserUpdate:
      type: object
      description: Todos los campos son opcionales. Email y tenantId son inmutables.
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        role: { type: string, enum: [admin, user] }
        image: { type: string, nullable: true }
      minProperties: 1
    UserUpdateMe:
      type: object
      description: >
        Body de PATCH /api/v1/users/me. A diferencia de UserUpdate, no tiene `role` ni
        `image`: es el DTO de un endpoint sin RBAC (dto.UpdateMeRequest), así que la
        ausencia de esos campos —no una validación— es lo que impide la autoescalada.
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
      minProperties: 1

    # User Roles
    UserRole:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        roleId: { type: string }
        status: { type: string, enum: [active, pending, revoked] }
        assignedBy: { type: string, format: uuid, nullable: true }
        assignedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, userId, tenantId, roleId, status, createdAt, updatedAt]
    UserRoleItem:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        roleId: { type: string }
        roleName: { type: string }
        status: { type: string, enum: [active, pending, revoked] }
      required: [tenantId, roleId, status]
    UserRoleAssign:
      type: object
      properties:
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        roleId: { type: string }
      required: [userId, tenantId, roleId]
    UserRoleBulkAssign:
      type: object
      properties:
        userIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
        tenantId: { type: string, format: uuid }
        roleId: { type: string }
      required: [userIds, tenantId, roleId]

    # Machines
    Machine:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        meta:
          type: object
          additionalProperties: true
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, code, active]
    MachineCreate:
      type: object
      properties:
        code: { type: string }
        meta:
          type: object
          additionalProperties: true
      required: [code]

    # Tenants
    TenantTheme:
      type: object
      properties:
        primaryColor: { type: string }
        secondaryColor: { type: string }
        accentColor: { type: string }
        textColor: { type: string }
        backgroundColor: { type: string }
        logoUrl: { type: string }
        faviconUrl: { type: string }

    TenantAddress:
      type: object
      properties:
        street: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        companyName: { type: string }
        subdomain: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        theme: { $ref: '#/components/schemas/TenantTheme' }
        address: { $ref: '#/components/schemas/TenantAddress' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, companyName, subdomain, isActive, theme, address, createdAt, updatedAt]

    TenantCreate:
      type: object
      properties:
        name: { type: string }
        companyName: { type: string }
        subdomain: { type: string }
        description: { type: string }
        adminUser:
          type: object
          properties:
            email: { type: string, format: email }
            firstName: { type: string }
            lastName: { type: string }
            password: { type: string, minLength: 8 }
          required: [email, firstName, lastName, password]
        theme:
          type: object
          properties:
            primaryColor: { type: string }
            secondaryColor: { type: string }
            accentColor: { type: string }
            textColor: { type: string }
            backgroundColor: { type: string }
          required: [primaryColor]
        address:
          type: object
          properties:
            street: { type: string }
            city: { type: string }
            state: { type: string }
            postalCode: { type: string }
            country: { type: string }
          required: [street, city, state, postalCode, country]
      required: [name, companyName, subdomain, adminUser, theme, address]

    TenantUpdate:
      type: object
      description: Todos los campos son opcionales. Solo se actualizan los campos enviados.
      properties:
        name: { type: string }
        companyName: { type: string }
        subdomain: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        theme:
          type: object
          properties:
            primaryColor: { type: string }
            secondaryColor: { type: string }
            accentColor: { type: string }
            textColor: { type: string }
            backgroundColor: { type: string }
            logoUrl: { type: string }
            faviconUrl: { type: string }
        address:
          type: object
          properties:
            street: { type: string }
            city: { type: string }
            state: { type: string }
            postalCode: { type: string }
            country: { type: string }

    PublicTenantResponse:
      type: object
      description: Subconjunto de Tenant seguro sin autenticación — sin address, contactEmail, companyWebsite ni description.
      properties:
        id: { type: string, format: uuid }
        subdomain: { type: string }
        name: { type: string }
        companyName: { type: string }
        isActive: { type: boolean }
        theme: { $ref: '#/components/schemas/TenantTheme' }
        settings:
          type: object
          properties:
            locale: { type: string }
            timezone: { type: string }
            dateFormat: { type: string }
            timeFormat: { type: string }
            currency: { type: string }
          required: [locale, timezone, dateFormat, timeFormat, currency]
      required: [id, subdomain, name, companyName, isActive, theme, settings]

    # Invitations
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role_id: { type: string }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        invited_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
      required: [id, tenant_id, email, role_id, status, invited_by, created_at, updated_at, expires_at]

    # Consumers (events & heartbeat)
    BatchEvents:
      type: object
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/EventItem'
      required: [events]
    EventItem:
      type: object
      properties:
        eventId: { type: string, description: Único para idempotencia. }
        machineId: { type: string }
        ts: { type: string, format: date-time }
        seq: { type: integer, minimum: 0 }
        kind: { type: string, enum: [metric, alarm, heartbeat] }
        schemaVersion: { type: integer, minimum: 1 }
        payload:
          type: object
          additionalProperties: true
      required: [eventId, machineId, ts, kind, schemaVersion, payload]

    Heartbeat:
      type: object
      properties:
        machineId: { type: string }
        ts: { type: string, format: date-time }
        status: { type: string, enum: [online, offline, degraded] }
      required: [machineId, ts, status]

  ########################
  # Notification Schemas
  ########################
    NotificationResponse:
      type: object
      required: [id, tenant_id, title, message, severity, status, created_at]
      properties:
        id:              { type: string, format: uuid }
        tenant_id:       { type: string, format: uuid }
        title:           { type: string }
        message:         { type: string }
        severity:        { type: string, enum: [info, warning, critical, error] }
        status:          { type: string, enum: [unread, acknowledged, closed] }
        alarm_rule_id:   { type: string, format: uuid, nullable: true }
        machine_id:      { type: string, format: uuid, nullable: true }
        created_at:      { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        closed_at:       { type: string, format: date-time, nullable: true }

    NotificationListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:   { type: array, items: { $ref: '#/components/schemas/NotificationResponse' } }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    NotificationCountResponse:
      type: object
      required: [unread]
      properties:
        unread: { type: integer }

  ########################
  # Log Service Schemas
  ########################
    LogEntry:
      type: object
      required: [id, tenant_id, created_at, severity, event_type, message, metadata]
      properties:
        id:          { type: string, format: uuid }
        tenant_id:   { type: string, format: uuid }
        created_at:  { type: string, format: date-time }
        severity:    { type: string, enum: [info, warning, critical, error] }
        event_type:  { type: string, enum: [alarm_triggered, alarm_resolved, device_connected, device_disconnected, device_state_changed, user_action, system] }
        source_id:   { type: string, format: uuid, nullable: true }
        machine_id:  { type: string, format: uuid, nullable: true }
        message:     { type: string }
        metadata:    { type: object, additionalProperties: true }

    LogListResponse:
      type: object
      required: [data, total]
      properties:
        data:        { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
        next_cursor: { type: string, nullable: true }
        total:       { type: integer }

    LogExportResponse:
      type: object
      required: [data, truncated, exported_count, total_available]
      properties:
        data:            { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
        truncated:       { type: boolean }
        exported_count:  { type: integer }
        total_available: { type: integer }

    LogContextResponse:
      type: object
      required: [before, anchor, after]
      properties:
        before: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
        anchor: { $ref: '#/components/schemas/LogEntry' }
        after:  { type: array, items: { $ref: '#/components/schemas/LogEntry' } }

    RetentionResponse:
      type: object
      required: [tenant_id, retention_days, next_purge_at, updated_at]
      properties:
        tenant_id:      { type: string, format: uuid }
        retention_days: { type: integer, minimum: 1 }
        next_purge_at:  { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }

    UpdateRetentionRequest:
      type: object
      required: [retention_days]
      properties:
        retention_days: { type: integer, minimum: 1, maximum: 3650 }

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]

    SupabaseAuthResponse:
      type: object
      description: Passthrough del body de Supabase Auth — no es un contrato propio de esta API.
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer }
        refresh_token: { type: string }
        user: { type: object, additionalProperties: true }
      additionalProperties: true

    PendingUserList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer }

    Permission:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        section: { type: string }
        description: { type: string }
        isSystemPermission: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, section, description, isSystemPermission]

    PermissionCreate:
      type: object
      properties:
        name: { type: string }
        section: { type: string }
        description: { type: string }
      required: [name, section, description]

    PermissionError:
      type: object
      properties:
        error: { type: string }
      required: [error]

    PermissionValidationError:
      type: object
      properties:
        error: { type: string, example: "Validation failed" }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
      required: [error, errors]

    ErrorResponse:
      type: object
      description: Formato de error de dominio compartido por Roles, Alarm Rules y Dashboard Layouts — no confundir con JWTError (401/403 de middleware).
      properties:
        error: { type: string, description: "Código de error, ej. ROLE_NOT_FOUND" }
        message: { type: string }
        status: { type: integer }
      required: [error, message, status]

    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
        isSystemRole: { type: boolean }
        isGlobal: { type: boolean }
        tenantId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, permissions, isSystemRole, isGlobal, createdAt, updatedAt]

    RoleWrite:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
      required: [name]

    AlarmRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        metric: { type: string }
        operator: { type: string, enum: [gt, lt, gte, lte, eq] }
        threshold: { type: number }
        severity: { type: string, enum: [info, warning, critical] }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, name, metric, operator, threshold, severity, enabled, createdAt, updatedAt]

    AlarmRuleCreate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        metric: { type: string }
        operator: { type: string, enum: [gt, lt, gte, lte, eq] }
        threshold: { type: number }
        severity: { type: string, enum: [info, warning, critical] }
        enabled: { type: boolean, default: true }
      required: [name, metric, operator, threshold, severity]

    AlarmRuleUpdate:
      type: object
      description: Todos los campos opcionales (actualización parcial).
      properties:
        name: { type: string }
        description: { type: string }
        metric: { type: string }
        operator: { type: string, enum: [gt, lt, gte, lte, eq] }
        threshold: { type: number }
        severity: { type: string, enum: [info, warning, critical] }
        enabled: { type: boolean }
      minProperties: 1

    LayoutWidgetPosition:
      type: object
      properties:
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }
        i: { type: string }
      required: [x, y, w, h, i]

    LayoutWidget:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        icon: { type: string }
        position: { $ref: '#/components/schemas/LayoutWidgetPosition' }
      required: [id, type, position]

    DashboardLayout:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/LayoutWidget' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, widgets, createdAt, updatedAt]

    DashboardLayoutWrite:
      type: object
      properties:
        name: { type: string }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/LayoutWidget' }
      required: [name]

    DashboardLayoutList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DashboardLayout' }
        meta:
          type: object
          properties:
            total: { type: integer }
            limit: { type: integer, description: "Hardcodeado a 3 hoy — no es un query param configurable." }
          required: [total, limit]
      required: [data, meta]

    MetricSpec:
      type: object
      properties:
        aasPath: { type: string }
        agg: { type: string, enum: [avg, sum, min, max, last, count, delta, raw] }
      required: [aasPath, agg]

    MetricsQueryRequest:
      type: object
      properties:
        machineId: { type: string }
        range: { type: string, enum: ["15m", "30m", "1h", "8h", "24h", "7d", "30d"] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket: { type: string, enum: ["1m", "5m", "15m", "1h", "6h", "1d"] }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/MetricSpec' }
          minItems: 1
          maxItems: 10
        groupBy: { type: string }
        filter:
          type: object
          properties:
            valueEquals: {}
        maxPoints: { type: integer }
      required: [machineId, metrics]

    MetricPoint:
      type: object
      properties:
        ts: { type: string, format: date-time }
        value: {}
      required: [ts, value]

    MetricScalarResult:
      type: object
      properties:
        aasPath: { type: string }
        agg: { type: string }
        value: { type: number }
        sampleCount: { type: integer }
      required: [aasPath, agg, value, sampleCount]

    MetricSeriesPoint:
      type: object
      properties:
        ts: { type: string, format: date-time }
        results:
          type: array
          items: { $ref: '#/components/schemas/MetricScalarResult' }
      required: [ts, results]

    MetricGroupResult:
      type: object
      properties:
        key: { type: string }
        value: { type: number }
      required: [key, value]

    MetricsQueryResponse:
      type: object
      description: >
        Forma discriminada por `mode`: `scalar` usa `results`, `series` usa
        `series`, `raw` usa `points`, `grouped` usa `groups`. Los campos no
        aplicables al modo actual se omiten.
      properties:
        mode: { type: string, enum: [scalar, series, raw, grouped] }
        machineId: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        dataAsOf: { type: string, format: date-time, nullable: true }
        bucket: { type: string }
        results:
          type: array
          items: { $ref: '#/components/schemas/MetricScalarResult' }
        series:
          type: array
          items: { $ref: '#/components/schemas/MetricSeriesPoint' }
        aasPath: { type: string }
        points:
          type: array
          items: { $ref: '#/components/schemas/MetricPoint' }
        agg: { type: string }
        groupBy: { type: string }
        groups:
          type: array
          items: { $ref: '#/components/schemas/MetricGroupResult' }
      required: [mode, machineId, from, to]

    MetricsQueryEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/MetricsQueryResponse' }
      required: [success, data]

    MetricsErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code: { type: string, enum: [INVALID_PARAMS, TOO_MANY_METRICS, RAW_MODE_CONFLICT, GROUP_BY_CONFLICT, RANGE_TOO_WIDE, TOO_MANY_GROUPS, TOO_MANY_QUERIES, QUERY_TIMEOUT] }
      required: [success, error, code]

    MetricsCatalogResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            machineId: { type: string }
            aasPaths:
              type: array
              items: { type: string }
          required: [machineId, aasPaths]
      required: [success, data]

    MetricsBatchQueryItem:
      allOf:
        - $ref: '#/components/schemas/MetricsQueryRequest'
        - type: object
          properties:
            id: { type: string }
          required: [id]

    MetricsBatchRequest:
      type: object
      properties:
        queries:
          type: array
          items: { $ref: '#/components/schemas/MetricsBatchQueryItem' }
          minItems: 1
          maxItems: 50
      required: [queries]

    MetricsBatchResultItem:
      type: object
      description: Los errores por ítem no abortan el batch — solo errores a nivel batch (ej. ids duplicados) devuelven un envelope de error top-level.
      properties:
        id: { type: string }
        success: { type: boolean }
        data: { $ref: '#/components/schemas/MetricsQueryResponse' }
        error: { type: string }
        code: { type: string }
      required: [id, success]

    MetricsBatchResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            results:
              type: array
              items: { $ref: '#/components/schemas/MetricsBatchResultItem' }
          required: [results]
      required: [success, data]

    EdgeDevice:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        machineId: { type: string }
        edgeType: { type: string, enum: [RASPBERRY_PLC] }
        raspberryBaseUrl: { type: string }
        plcAddress: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        lastHealthCheckAt: { type: string, format: date-time, nullable: true }
        lastHealthStatus: { type: string, enum: [OK, DEGRADED, ERROR, UNKNOWN] }
        lastHealthSummary: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, name, machineId, edgeType, raspberryBaseUrl, status, lastHealthStatus, createdAt, updatedAt]

    EdgeDeviceCreate:
      type: object
      properties:
        name: { type: string }
        machineId: { type: string }
        edgeType: { type: string, enum: [RASPBERRY_PLC] }
        raspberryBaseUrl: { type: string }
        description: { type: string, nullable: true }
        plcAddress: { type: string, nullable: true }
      required: [name, machineId, edgeType, raspberryBaseUrl]

    EdgeDeviceUpdate:
      type: object
      description: machineId y edgeType son inmutables — no se aceptan en este body.
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        raspberryBaseUrl: { type: string, nullable: true }
        plcAddress: { type: string, nullable: true }

    EdgeDeviceEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/EdgeDevice' }
      required: [success, data]

    EdgeDeviceListEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/EdgeDevice' }
      required: [success, data]

    EdgeDeviceErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
      required: [success, error]

    EdgeDeviceCheckResult:
      type: object
      properties:
        checkType: { type: string, enum: [STATUS, HEALTH_CHECK] }
        checkedAt: { type: string, format: date-time }
        overallStatus: { type: string, enum: [OK, DEGRADED, ERROR, UNKNOWN] }
        summary: { type: string }
        details:
          type: object
          additionalProperties: true
      required: [checkType, checkedAt, overallStatus, summary]

    EdgeDeviceCheckResultEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/EdgeDeviceCheckResult' }
      required: [success, data]

    EdgeDeviceTelemetry:
      type: object
      properties:
        capturedAt: { type: string, format: date-time }
        cpu:
          type: object
          nullable: true
          properties:
            usagePercent: { type: number, nullable: true }
        ram:
          type: object
          nullable: true
          properties:
            usedPercent: { type: number }
            usedMb: { type: number }
            totalMb: { type: number }
        disk:
          type: object
          nullable: true
          properties:
            usedPercent: { type: number }
            usedGb: { type: number }
            totalGb: { type: integer }
        temperatureCelsius: { type: number, nullable: true }
        uptimeSeconds: { type: integer, nullable: true }
        plc:
          type: object
          nullable: true
          properties:
            reachable: { type: boolean }
            latencyMs: { type: integer, nullable: true }
            lastHeartbeatAt: { type: string, format: date-time, nullable: true }
      required: [capturedAt]

    EdgeDeviceTelemetryEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/EdgeDeviceTelemetry' }
      required: [success, data]

    EdgeDeviceEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        checkType: { type: string, enum: [STATUS, HEALTH_CHECK] }
        checkedAt: { type: string, format: date-time }
        overallStatus: { type: string, enum: [OK, DEGRADED, ERROR, UNKNOWN] }
        summary: { type: string, nullable: true }
        details:
          type: object
          additionalProperties: true
        userId: { type: string, format: uuid }
        userEmail: { type: string, format: email }
      required: [id, deviceId, tenantId, checkType, checkedAt, overallStatus, userId, userEmail]

    EdgeDeviceEventListEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/EdgeDeviceEvent' }
      required: [success, data]

    EdgeDeviceAPIKey:
      type: object
      description: Nunca incluye el secreto en texto plano — eso solo aparece en la respuesta de creación (ver `EdgeDeviceAPIKeyCreated`).
      properties:
        id: { type: string }
        keyId: { type: string }
        name: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
        deviceStatus: { type: string, enum: [ACTIVE, DISABLED] }
      required: [id, keyId, createdAt, active, deviceStatus]

    EdgeDeviceAPIKeyCreate:
      type: object
      properties:
        name: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    EdgeDeviceAPIKeyCreated:
      description: Igual a `EdgeDeviceAPIKey` más el secreto en texto plano — se muestra una única vez, en esta respuesta.
      allOf:
        - $ref: '#/components/schemas/EdgeDeviceAPIKey'
        - type: object
          properties:
            key: { type: string }
          required: [key]

    EdgeDeviceAPIKeyEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/EdgeDeviceAPIKeyCreated' }
      required: [success, data]

    EdgeDeviceAPIKeyListEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/EdgeDeviceAPIKey' }
      required: [success, data]

  ########################
  # Standard responses
  ########################
  responses:
    CreatedID:
      description: Recurso creado
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/IDResponse' }

    UserList:
      description: Lista de usuarios
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }

    MachineList:
      description: Lista de máquinas
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Machine' }

    BatchAck:
      description: Resultado de ingesta
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted: { type: integer, minimum: 0 }
                      rejected: { type: integer, minimum: 0 }
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            index: { type: integer, minimum: 0 }
                            code: { type: string }
                            message: { type: string }

    Ok:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'

    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unauthorized:
      description: No autenticado (JWT inválido o ausente)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JWTError'
          example:
            error: "UNAUTHORIZED"
            message: "No autorizado"
            status: 401
    Forbidden:
      description: Acción no permitida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    RateLimited:
      description: Se excedieron los límites de tasa
      headers:
        Retry-After:
          description: Segundos a esperar antes de reintentar.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    InternalError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'

