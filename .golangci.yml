version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - sqlclosecheck
    - unconvert
  exclusions:
    rules:
      # Cierre "best effort" en defer (resp.Body, cursores, tx.Rollback tras commit,
      # logger.Sync): common idiom, no vale la pena chequear el error en cada uno.
      - linters:
          - errcheck
        text: "Error return value of .*\\.(Close|Rollback|Sync). is not checked"

formatters:
  enable:
    - gofmt
    - goimports
